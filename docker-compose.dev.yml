# Nur für die lokale Entwicklung: PostgreSQL 16 (Dev- und Testdatenbank) und Mailpit,
# das alle Mails abfängt (Web-Oberfläche: http://localhost:8025).
#   docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paperradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paperradar}
      POSTGRES_DB: ${POSTGRES_DB:-paperradar}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      # Legt beim ersten Start zusätzlich die Testdatenbank an.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025' # SMTP
      - '127.0.0.1:8025:8025' # Web-Oberfläche und API

volumes:
  pgdata-dev:
