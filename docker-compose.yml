# Paper-Radar – Betrieb mit Docker Compose
#
#   cp .env.example .env    # mindestens DOMAIN, POSTGRES_PASSWORD, AUTH_SECRET, SMTP_* setzen
#   docker compose up -d --build
#
# Lokal ausprobieren (selbstsigniertes Zertifikat, Mails in Mailpit unter http://localhost:8025):
#   DOMAIN=localhost docker compose --profile mailpit up -d --build
#
# Dienste: postgres (Daten), migrate (einmalig), app (Web), worker (Jobs; genau einer!),
# caddy (HTTPS), backup (nächtlicher pg_dump), mailpit (optional, Profil „mailpit“).

name: paper-radar

x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-paperradar}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}@postgres:5432/${POSTGRES_DB:-paperradar}
  ORIGIN: ${ORIGIN:-https://${DOMAIN:-localhost}}
  AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET in .env setzen (openssl rand -base64 32)}
  AUTH_TRUST_HOST: 'true'
  NODE_ENV: production

x-app: &app
  image: paper-radar:latest
  env_file:
    - path: ${APP_ENV_FILE:-.env}
      required: false
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paperradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
      POSTGRES_DB: ${POSTGRES_DB:-paperradar}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    image: paper-radar:latest
    command: ['node', 'dist/migrate.js']
    env_file:
      - path: ${APP_ENV_FILE:-.env}
        required: false
    environment: *app-env
    restart: 'no'
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *app
    environment:
      <<: *app-env
      PORT: '3000'
    expose:
      - '3000'

  worker:
    <<: *app
    command: ['node', 'dist/worker.js']
    environment: *app-env
    # Der Worker hat keinen HTTP-Port; sein Herzschlag erscheint in /api/health.
    healthcheck:
      disable: true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-${DOMAIN:-localhost}}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ['/usr/local/bin/backup-entrypoint']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-paperradar}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}@postgres:5432/${POSTGRES_DB:-paperradar}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-30 2 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_ON_START: ${BACKUP_ON_START:-false}
    volumes:
      - backups:/backups
      - ./docker/backup/entrypoint.sh:/usr/local/bin/backup-entrypoint:ro
      - ./docker/backup/backup.sh:/usr/local/bin/paper-radar-backup:ro
      - ./docker/backup/restore.sh:/usr/local/bin/paper-radar-restore:ro
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.31.6
    profiles: ['mailpit']
    restart: unless-stopped
    ports:
      - '127.0.0.1:8025:8025'

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  backups:
