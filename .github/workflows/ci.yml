name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paperradar
          POSTGRES_PASSWORD: paperradar
          POSTGRES_DB: paperradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paperradar -d paperradar_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://paperradar:paperradar@localhost:5432/paperradar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: lint-test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paperradar
          POSTGRES_PASSWORD: paperradar
          POSTGRES_DB: paperradar_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paperradar -d paperradar_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31.6
        ports:
          - 1025:1025
          - 8025:8025
    env:
      E2E_DATABASE_URL: postgres://paperradar:paperradar@localhost:5432/paperradar_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen
        run: docker build -t paper-radar:ci .
      - name: Compose-Datei prüfen
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci
          AUTH_SECRET: ci-secret-0123456789abcdefghijkl
      - name: Gebündelte Skripte im Image prüfen
        run: |
          docker run --rm paper-radar:ci node --check dist/worker.js
          docker run --rm paper-radar:ci node --check dist/migrate.js
          docker run --rm paper-radar:ci ls migrations/0000_init.sql
